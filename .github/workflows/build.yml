name: Compilar mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir
        run: unzip -q titan-boss-mod.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Compilar
        working-directory: titan-boss-mod
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: titan-boss-mod-jar
          path: titan-boss-mod/build/libs/*.jar
          if-no-files-found: error
